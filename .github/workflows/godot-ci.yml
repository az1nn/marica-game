name: Godot CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  headless:
    name: Godot 4.7.2 import, parse and smoke
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Guard exact-head checkout and pinned tool contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python3 - <<'PY'
          import json
          from pathlib import Path

          version = Path("game/.godot-version").read_text(encoding="utf-8").strip()
          lock = json.loads(Path("game/test-runner.lock.json").read_text(encoding="utf-8"))
          assert version == "4.7.2-stable", f"Unexpected Godot version: {version}"
          assert lock["project_godot"] == version, "Engine/test runner mismatch"
          assert lock["runner"] == "GUT" and lock["version"] == "v9.7.1", "Runner pin mismatch"
          assert lock["commit"] == "aeb5d4f3f7f0a6c9b5e178876d6c99b791fda605", "GUT commit pin mismatch"
          assert lock["install_path"] == "addons/gut", "Unexpected install path"
          print(f"Exact-head pin gate PASS: Godot {version} + GUT {lock['version']}")
          PY

      - name: G415 typed GDScript quality (exact-head)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/godot -p 'test_*.py' -v
          python3 tools/godot/check_gdscript_types.py game/src game/tests
          python3 tools/godot/validate_golden_fixtures.py
          python3 -m venv "$RUNNER_TEMP/gdscript-style-venv"
          "$RUNNER_TEMP/gdscript-style-venv/bin/pip" install --disable-pip-version-check -r game/requirements-gdscript.txt
          (
            cd game
            "$RUNNER_TEMP/gdscript-style-venv/bin/gdformat" --diff src tests || true
            "$RUNNER_TEMP/gdscript-style-venv/bin/gdformat" --check src tests
            "$RUNNER_TEMP/gdscript-style-venv/bin/gdlint" src tests
          )

      - name: Install and verify pinned Godot editor
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors \
            --output "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --version | tee "$RUNNER_TEMP/godot-version.log"
          grep -q '4.7.2.stable' "$RUNNER_TEMP/godot-version.log"

      - name: Bootstrap exact GUT release for subsequent GDScript tests
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --single-branch --branch v9.7.1 \
            https://github.com/bitwes/Gut.git "$RUNNER_TEMP/gut"
          test "$(git -C "$RUNNER_TEMP/gut" rev-parse HEAD)" = "aeb5d4f3f7f0a6c9b5e178876d6c99b791fda605"
          mkdir -p game/addons
          cp -a "$RUNNER_TEMP/gut/addons/gut" game/addons/gut
          test -f game/addons/gut/gut_cmdln.gd
          echo "GUT v9.7.1 exact commit bootstrapped"

      - name: Headless project import
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" \
            --headless --editor --path game --import --quit 2>&1 | tee "$RUNNER_TEMP/godot-import.log"

      - name: Headless project parse/load
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" \
            --headless --editor --path game --quit 2>&1 | tee "$RUNNER_TEMP/godot-parse.log"

      - name: Headless main-scene boot (G414)
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" \
            --headless --path game --quit-after 3 2>&1 | tee "$RUNNER_TEMP/godot-scene-boot.log"
          grep -Fq 'MARICA_G414_SCENE_READY' "$RUNNER_TEMP/godot-scene-boot.log"

      - name: Deterministic runtime smoke (G414)
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" \
            --headless --path game --script res://tests/smoke_runner.gd 2>&1 | tee "$RUNNER_TEMP/godot-smoke.log"
          grep -Fq 'MARICA_G414_SMOKE_PASS' "$RUNNER_TEMP/godot-smoke.log"

      - name: G416 deterministic golden fixture harness
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" \
            --headless --path game --script res://tests/golden_fixture_runner.gd \
            2>&1 | tee "$RUNNER_TEMP/godot-g416-fixtures.log"
          grep -Fq 'MARICA_G416_HARNESS_PASS' "$RUNNER_TEMP/godot-g416-fixtures.log"
          grep -Fq 'parity=NOT_YET_PROVEN' "$RUNNER_TEMP/godot-g416-fixtures.log"

      - name: G420 Pet identity and exact Luau PetId golden parity
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" \
            --headless --path game --script res://tests/pet_identity_runner.gd \
            2>&1 | tee "$RUNNER_TEMP/godot-g420-pet.log"
          grep -Fq 'MARICA_G420_PET_IDENTITY_PASS' "$RUNNER_TEMP/godot-g420-pet.log"
          grep -Fq 'MARICA_G420_PET_ID_PARITY_PASS cases=5' "$RUNNER_TEMP/godot-g416-fixtures.log"
          grep -Fq 'parity=NOT_YET_PROVEN' "$RUNNER_TEMP/godot-g416-fixtures.log"

      - name: G420 P0 mutation proof (GOOD > BAD > RESTORE)
        shell: bash
        run: |
          set -euo pipefail
          cp game/src/domain/pet_id.gd "$RUNNER_TEMP/g420-pet-id-good.gd"
          python3 - <<'PY'
          from pathlib import Path
          path = Path("game/src/domain/pet_id.gd")
          original = path.read_text(encoding="utf-8")
          target = "if text.strip_edges().is_empty():"
          assert original.count(target) == 1, "PetId guard has drifted"
          path.write_text(original.replace(target, 'if text == "":'), encoding="utf-8")
          print("G420 bad mutant: whitespace-only IDs bypass guard")
          PY
          set +e
          timeout 45s "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" \
            --headless --path game --script res://tests/golden_fixture_runner.gd \
            > "$RUNNER_TEMP/g420-mutant.log" 2>&1
          mutant_exit="$?"
          set -e
          cp "$RUNNER_TEMP/g420-pet-id-good.gd" game/src/domain/pet_id.gd
          if test "$mutant_exit" -eq 0; then
            echo "G420 mutation proof failed: bad mutant unexpectedly passed"
            exit 1
          fi
          grep -Fq 'PetId golden mismatch' "$RUNNER_TEMP/g420-mutant.log"
          timeout 45s "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" \
            --headless --path game --script res://tests/golden_fixture_runner.gd \
            2>&1 | tee "$RUNNER_TEMP/g420-restore.log"
          grep -Fq 'MARICA_G420_PET_ID_PARITY_PASS cases=5' "$RUNNER_TEMP/g420-restore.log"
          git diff --exit-code -- game/src/domain/pet_id.gd
          echo "MARICA_G420_MUTATION_PROOF_PASS good=pass bad=fail restore=pass"

      - name: G421 Lineage and Pedigree executable golden parity
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" \
            --headless --path game --script res://tests/lineage_pedigree_runner.gd \
            2>&1 | tee "$RUNNER_TEMP/g421-lineage-pedigree.log"
          grep -Fq 'MARICA_G421_LINEAGE_PEDIGREE_PASS' "$RUNNER_TEMP/g421-lineage-pedigree.log"
          grep -Fq 'MARICA_G421_LINEAGE_ID_PARITY_PASS cases=6' "$RUNNER_TEMP/godot-g416-fixtures.log"
          grep -Fq 'MARICA_G421_PEDIGREE_PARITY_PASS cases=15' "$RUNNER_TEMP/godot-g416-fixtures.log"
          grep -Fq 'MARICA_G420_PET_ID_PARITY_PASS cases=5' "$RUNNER_TEMP/godot-g416-fixtures.log"
          grep -Fq 'parity=NOT_YET_PROVEN' "$RUNNER_TEMP/godot-g416-fixtures.log"

      - name: G421 pedigree mutation proof (GOOD > BAD > RESTORE)
        shell: bash
        run: |
          set -euo pipefail
          cp game/src/domain/pedigree.gd "$RUNNER_TEMP/g421-pedigree-good.gd"
          python3 - <<'PY'
          from pathlib import Path
          path = Path("game/src/domain/pedigree.gd")
          source = path.read_text(encoding="utf-8")
          target = "if generation == 0 and not parents.is_empty():"
          assert source.count(target) == 1, "G421 founder guard has drifted"
          path.write_text(source.replace(target, "if false and not parents.is_empty():"), encoding="utf-8")
          print("G421 mutant: founder parents mistakenly allowed")
          PY
          set +e
          timeout 45s "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" \
            --headless --path game --script res://tests/golden_fixture_runner.gd \
            > "$RUNNER_TEMP/g421-mutant.log" 2>&1
          mutant_exit="$?"
          set -e
          cp "$RUNNER_TEMP/g421-pedigree-good.gd" game/src/domain/pedigree.gd
          if test "$mutant_exit" -eq 0; then
            echo "G421 mutation proof failed: bad mutant unexpectedly passed"
            exit 1
          fi
          grep -Fq 'pedigree.create golden mismatch' "$RUNNER_TEMP/g421-mutant.log"
          timeout 45s "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" \
            --headless --path game --script res://tests/golden_fixture_runner.gd \
            2>&1 | tee "$RUNNER_TEMP/g421-restore.log"
          grep -Fq 'MARICA_G421_PEDIGREE_PARITY_PASS cases=15' "$RUNNER_TEMP/g421-restore.log"
          git diff --exit-code -- game/src/domain/pedigree.gd
          echo "MARICA_G421_MUTATION_PROOF_PASS good=pass bad=fail restore=pass"

      - name: G422 lifecycle state machine and Luau golden parity
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" \
            --headless --path game --script res://tests/lifecycle_runner.gd \
            2>&1 | tee "$RUNNER_TEMP/g422-lifecycle.log"
          grep -Fq 'MARICA_G422_LIFECYCLE_PASS' "$RUNNER_TEMP/g422-lifecycle.log"
          grep -Fq 'MARICA_G422_LIFECYCLE_PARITY_PASS cases=19' "$RUNNER_TEMP/godot-g416-fixtures.log"
          grep -Fq 'parity=NOT_YET_PROVEN' "$RUNNER_TEMP/godot-g416-fixtures.log"

      - name: G422 lifecycle natural-end mutation proof (GOOD > BAD > RESTORE)
        shell: bash
        run: |
          set -euo pipefail
          cp game/src/domain/lifecycle.gd "$RUNNER_TEMP/g422-lifecycle-good.gd"
          python3 - <<'PY'
          from pathlib import Path
          path = Path("game/src/domain/lifecycle.gd")
          source = path.read_text(encoding="utf-8")
          target = 'if reason == "natural" and current._stage != "senior":'
          assert source.count(target) == 1, "G422 natural-end guard has drifted"
          path.write_text(source.replace(target, 'if false and current._stage != "senior":'), encoding="utf-8")
          print("G422 mutant: early natural end mistakenly allowed")
          PY
          set +e
          timeout 45s "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" \
            --headless --path game --script res://tests/golden_fixture_runner.gd \
            > "$RUNNER_TEMP/g422-mutant.log" 2>&1
          mutant_exit="$?"
          set -e
          cp "$RUNNER_TEMP/g422-lifecycle-good.gd" game/src/domain/lifecycle.gd
          if test "$mutant_exit" -eq 0; then
            echo "G422 mutant unexpectedly passed"
            exit 1
          fi
          grep -Fq 'lifecycle.transitions golden mismatch' "$RUNNER_TEMP/g422-mutant.log"
          timeout 45s "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" \
            --headless --path game --script res://tests/golden_fixture_runner.gd \
            2>&1 | tee "$RUNNER_TEMP/g422-restore.log"
          grep -Fq 'MARICA_G422_LIFECYCLE_PARITY_PASS cases=19' "$RUNNER_TEMP/g422-restore.log"
          git diff --exit-code -- game/src/domain/lifecycle.gd
          echo "MARICA_G422_MUTATION_PROOF_PASS good=pass bad=fail restore=pass"

      - name: Upload Godot CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-ci-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/godot-version.log
            ${{ runner.temp }}/godot-import.log
            ${{ runner.temp }}/godot-parse.log
            ${{ runner.temp }}/godot-scene-boot.log
            ${{ runner.temp }}/godot-smoke.log
            ${{ runner.temp }}/godot-g416-fixtures.log
            ${{ runner.temp }}/godot-g420-pet.log
            ${{ runner.temp }}/g420-mutant.log
            ${{ runner.temp }}/g420-restore.log
            ${{ runner.temp }}/g421-lineage-pedigree.log
            ${{ runner.temp }}/g421-mutant.log
            ${{ runner.temp }}/g421-restore.log
            ${{ runner.temp }}/g422-lifecycle.log
            ${{ runner.temp }}/g422-mutant.log
            ${{ runner.temp }}/g422-restore.log
          if-no-files-found: warn
