          python3 - <<'PY'
          from pathlib import Path
          path = Path("game/src/domain/health.gd")
          source = path.read_text(encoding="utf-8")
          target = "if neglect_hours >= SICK_AT_HOURS:"
          assert source.count(target) == 1, "G426 sickness threshold drifted"
          path.write_text(
              source.replace(target, "if neglect_hours > SICK_AT_HOURS:"),
              encoding="utf-8",
          )
          print("G426 bad mutant: sickness should occur at exactly 48 hours")
          PY
          set +e
          timeout 45s "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" \
            --headless --path game --script res://tests/golden_fixture_runner.gd \
            > "$RUNNER_TEMP/g426-mutant.log" 2>&1
          mutant_exit="$?"
