name: G445 Durable Succession

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  durable-succession:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact HEAD and pinned Godot
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          curl --fail --location --retry 3 --retry-all-errors -o "$RUNNER_TEMP/godot.zip" "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
      - name: G445 exact-head good runner
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          timeout 45s "$GODOT" --headless --editor --path game --import --quit > "$RUNNER_TEMP/g445-import.log" 2>&1
          timeout 45s "$GODOT" --headless --path game --script res://tests/durable_succession_runner.gd 2>&1 | tee "$RUNNER_TEMP/g445-good.log"
          grep -Fq 'MARICA_G445_DURABLE_MARKERS_PASS scenarios=12' "$RUNNER_TEMP/g445-good.log"
      - name: QA GOOD-BAD-RESTORE
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=game/src/adapters/local/durable_succession.gd
          cp "$SOURCE" "$RUNNER_TEMP/g445-good.gd"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("game/src/adapters/local/durable_succession.gd")
          s = p.read_text()
          target = '    if doc["succession_events"].has(parent_id):'
          assert s.count(target) == 1
          p.write_text(s.replace(target, '    if false and doc["succession_events"].has(parent_id):'))
          print("G445 BAD: disable persisted marker replay")
          PY
          set +e
          timeout 45s "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path game --script res://tests/durable_succession_runner.gd > "$RUNNER_TEMP/g445-bad.log" 2>&1
          BAD_CODE="$?"
          set -e
          cp "$RUNNER_TEMP/g445-good.gd" "$SOURCE"
          if test "$BAD_CODE" -eq 0; then
            echo "G445 mutant escaped"
            exit 1
          fi
          grep -Eq 'MARICA_G445_FAIL|SCRIPT ERROR|Invalid access' "$RUNNER_TEMP/g445-bad.log"
          timeout 45s "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path game --script res://tests/durable_succession_runner.gd 2>&1 | tee "$RUNNER_TEMP/g445-restored.log"
          grep -Fq 'MARICA_G445_DURABLE_MARKERS_PASS scenarios=12' "$RUNNER_TEMP/g445-restored.log"
          git diff --exit-code -- "$SOURCE"
          echo 'MARICA_G445_MUTATION_PASS good=pass bad=fail restore=pass'
      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g445-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: ignore
          path: ${{ runner.temp }}/g445-*.log
