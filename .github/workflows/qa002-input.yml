name: QA-002 native Web mouse and touch

on:
  pull_request:
    paths:
      - '.github/workflows/qa002-input.yml'
      - 'game/src/qa/qa_web_preview.gd'
      - 'tools/qa/qa002_input_profile.py'
      - 'docs/qa/QA-002-INPUT.md'
      - '.siga/session-claim-qa002-founder-input-20261018-gpt6.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa002-input:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact PR SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify isolation and prepare browser
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          echo 'b8089122d323de7dc7c235604f752ce2643990a867aceaead60409d700e2aa7e  game/assets/arch_probes/S01_A01_v4_original.png' | sha256sum --check
          test "$(cat game/.godot-version)" = '4.7.2-stable'
          google-chrome --version
          python3 -m pip install --disable-pip-version-check 'playwright==1.55.0' 'Pillow==11.3.0'
          python3 -m py_compile tools/qa/qa002_input_profile.py

      - name: Build actual pinned Godot WebAssembly in scratch project
        shell: bash
        run: |
          set -euo pipefail
          bash tools/qa/build_vercel_godot.sh
          test -s build/qa-preview/index.wasm
          test -s build/qa-preview/index.pck
          git diff --exit-code -- game/project.godot
          echo MARICA_QA002_GODOT_EXPORT_PASS

      - name: Prove native Godot tap and negative drag control in Chrome
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qa002-input"
          python3 tools/qa/qa002_input_profile.py \
            --web-dir build/qa-preview \
            --output "$RUNNER_TEMP/qa002-input" \
            --head-sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            2>&1 | tee "$RUNNER_TEMP/qa002-input.log"
          grep -Fq 'MARICA_QA002_INPUT_PASS' "$RUNNER_TEMP/qa002-input.log"

      - name: Preserve exact HEAD input proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa002-input-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/qa002-input/*
            ${{ runner.temp }}/qa002-input.log
