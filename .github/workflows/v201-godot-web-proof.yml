name: V201 Godot Web Export Proof

on:
  pull_request:
    paths:
      - 'game/scenes/arch_v201_web_probe.tscn'
      - 'game/src/presentation/arch_v201_web_probe.gd'
      - 'tools/arch/v201_godot_web_profile.py'
      - '.github/workflows/v201-godot-web-proof.yml'
      - 'docs/arch/V201-V201A-BROWSER-DEVICE-GATES.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-web-export:
    runs-on: ubuntu-22.04
    timeout-minutes: 22
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Exact-head and approved source gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git hash-object game/assets/arch_probes/S01_A01_v4_original.png)" = "da7806ebfcb051c8fd32ccdbad4760b7136f97dd"
          echo 'b8089122d323de7dc7c235604f752ce2643990a867aceaead60409d700e2aa7e  game/assets/arch_probes/S01_A01_v4_original.png' | sha256sum --check

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pin hosted Chrome, Pillow and Playwright
        run: |
          set -euo pipefail
          command -v google-chrome
          google-chrome --version
          python3 -m pip install --disable-pip-version-check 'playwright==1.55.0' 'Pillow==11.3.0'
          python3 -m py_compile tools/arch/v201_godot_web_profile.py

      - name: Download official pinned Godot 4.7.2 and export templates
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors             -o "$RUNNER_TEMP/godot.zip"             'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip'
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          curl --fail --location --retry 3 --retry-all-errors --max-time 600             -o "$RUNNER_TEMP/godot-templates.tpz"             'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz'
          echo "f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  $RUNNER_TEMP/godot-templates.tpz" | sha256sum --check
          TEMPLATES="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$TEMPLATES"
          unzip -q -j "$RUNNER_TEMP/godot-templates.tpz" 'templates/web*' -d "$TEMPLATES"
          find "$TEMPLATES" -maxdepth 1 -type f -name 'web*release*' -print | grep -q .

      - name: Export temporary isolated founder scene as real Godot WebAssembly
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          cp game/project.godot "$RUNNER_TEMP/original-project.godot"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("game/project.godot")
          source = p.read_text(encoding="utf-8")
          target = 'run/main_scene="res://scenes/smoke.tscn"'
          assert source.count(target) == 1
          p.write_text(
              source.replace(target, 'run/main_scene="res://scenes/arch_v201_web_probe.tscn"')
              + '\n[rendering]\nrenderer/rendering_method="gl_compatibility"\n'
              + 'renderer/rendering_method.mobile="gl_compatibility"\n'
          )
          PY
          cat > game/export_presets.cfg <<'EOF'
          [preset.0]

          name="Web"
          platform="Web"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path=""
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          variant/extensions_support=false
          variant/thread_support=false
          vram_texture_compression/for_desktop=true
          vram_texture_compression/for_mobile=false
          html/canvas_resize_policy=2
          html/focus_canvas_on_start=true
          progressive_web_app/enabled=false
          EOF
          mkdir -p "$RUNNER_TEMP/v201-godot-web"
          timeout 90s "$GODOT" --headless --editor --path game --import --quit 2>&1 | tee "$RUNNER_TEMP/v201-web-import.log"
          echo 'Installed Godot web templates:'
          find "$HOME/.local/share/godot/export_templates/4.7.2.stable" -maxdepth 1 -type f -printf '%f %s bytes\n' | head -20
          timeout 180s "$GODOT" --verbose --headless --path game --export-release Web "$RUNNER_TEMP/v201-godot-web/index.html" 2>&1 | tee "$RUNNER_TEMP/v201-web-export.log"
          test -s "$RUNNER_TEMP/v201-godot-web/index.html"
          find "$RUNNER_TEMP/v201-godot-web" -maxdepth 1 -type f -name '*.wasm' | grep -q .
          find "$RUNNER_TEMP/v201-godot-web" -maxdepth 1 -type f -name '*.pck' | grep -q .
          cp "$RUNNER_TEMP/original-project.godot" game/project.godot
          rm game/export_presets.cfg
          git diff --exit-code -- game/project.godot
          echo 'MARICA_V201_GODOT_WEB_EXPORT_PASS isolated_scene=true source_unchanged=true'

      - name: Start real Godot exported WebAssembly in Chrome (desktop + mobile emulated)
        shell: bash
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v201-web-browser"
          python3 tools/arch/v201_godot_web_profile.py             --web-dir "$RUNNER_TEMP/v201-godot-web"             --output "$RUNNER_TEMP/v201-web-browser" --head-sha "$EXACT_HEAD"             2>&1 | tee "$RUNNER_TEMP/v201-godot-web-profile.log"
          grep -Fq 'MARICA_V201_GODOT_WEB_PASS' "$RUNNER_TEMP/v201-godot-web-profile.log"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          base=Path(os.environ["RUNNER_TEMP"])
          data=json.loads((base/"v201-web-browser"/"manifest.json").read_text())
          assert data["head_sha"] == os.environ["EXACT_HEAD"]
          assert data["godot_web_export_executed"] is True
          assert data["physical_android_or_ios_executed"] is False
          assert data["fps_release_gate"] == "NOT_CERTIFIED"
          assert len(data["captures"]) == 2
          for sample in data["captures"]:
              assert sample["engine_webassembly_runtime_ready"] is True
              path=base/"v201-web-browser"/sample["file"]
              assert hashlib.sha256(path.read_bytes()).hexdigest()==sample["png_sha256"]
          files={}
          for p in sorted((base/"v201-godot-web").iterdir()):
              if p.is_file():
                  files[p.name]={"sha256":hashlib.sha256(p.read_bytes()).hexdigest(),"bytes":p.stat().st_size}
          (base/"v201-web-browser"/"export_files.json").write_text(json.dumps({
              "head_sha":os.environ["EXACT_HEAD"],
              "source_png_sha256":"b8089122d323de7dc7c235604f752ce2643990a867aceaead60409d700e2aa7e",
              "template_zip_sha256":"f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011",
              "files":files
          },indent=2))
          print('MARICA_V201_GODOT_WEB_MANIFEST_PASS exact_head=true no_mobile_hardware=true')
          PY

      - name: Upload exported Godot web build, screenshots and exact-head manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v201-godot-web-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/v201-godot-web/*
            ${{ runner.temp }}/v201-web-browser/*.png
            ${{ runner.temp }}/v201-web-browser/manifest.json
            ${{ runner.temp }}/v201-web-browser/export_files.json
            ${{ runner.temp }}/v201-web-import.log
            ${{ runner.temp }}/v201-web-export.log
            ${{ runner.temp }}/v201-godot-web-profile.log
