name: QA-001 Godot Web Interactive Diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/qa-web-preview.yml'
      - 'game/scenes/qa_web_preview.tscn'
      - 'game/src/qa/qa_web_preview.gd'
      - 'tools/qa/qa_web_profile.py'
      - 'specs/008-qa-web-preview/**'
      - 'docs/qa/QA-001-WEB-PREVIEW.md'
      - '.siga/session-claim-qa001-web-access-20261018-gpt6.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa-web-export:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Source and version guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(cat game/.godot-version)" = "4.7.2-stable"
          test "$(git hash-object game/assets/arch_probes/S01_A01_v4_original.png)" = "da7806ebfcb051c8fd32ccdbad4760b7136f97dd"
          echo "b8089122d323de7dc7c235604f752ce2643990a867aceaead60409d700e2aa7e  game/assets/arch_probes/S01_A01_v4_original.png" | sha256sum --check
          test -f game/scenes/v203_portrait_preview.tscn
          grep -Fq 'func pan_by_screen_delta(' game/src/presentation/v203_portrait_preview.gd
          echo MARICA_QA001_SOURCE_GATES_PASS

      - name: Chrome browser proof dependencies
        shell: bash
        run: |
          set -euo pipefail
          google-chrome --version
          python3 -m pip install --disable-pip-version-check 'playwright==1.55.0' 'Pillow==11.3.0'
          python3 -m py_compile tools/qa/qa_web_profile.py

      - name: Download pinned official Godot 4.7.2 and Web templates
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          curl --fail --location --retry 3 --retry-all-errors --max-time 600 \
            -o "$RUNNER_TEMP/godot-templates.tpz" \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          echo "f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  $RUNNER_TEMP/godot-templates.tpz" | sha256sum --check
          TEMPLATES="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$TEMPLATES"
          unzip -q -j "$RUNNER_TEMP/godot-templates.tpz" 'templates/web*' -d "$TEMPLATES"
          find "$TEMPLATES" -maxdepth 1 -type f -name 'web*release*' | grep -q .
          echo MARICA_QA001_PINNED_GODOT_PASS

      - name: Export isolated V206 QA scene with temporary project override
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          cp game/project.godot "$RUNNER_TEMP/qa-original-project.godot"
          python3 - <<'PY'
          from pathlib import Path
          path = Path("game/project.godot")
          old = path.read_text(encoding="utf-8")
          target = 'run/main_scene="res://scenes/smoke.tscn"'
          assert old.count(target) == 1
          path.write_text(
              old.replace(target, 'run/main_scene="res://scenes/qa_web_preview.tscn"')
              + '\n[rendering]\nrenderer/rendering_method="gl_compatibility"\n'
              + 'renderer/rendering_method.mobile="gl_compatibility"\n',
              encoding="utf-8")
          PY
          cat > game/export_presets.cfg <<'EOF'
          [preset.0]

          name="Web"
          platform="Web"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path=""
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          variant/extensions_support=false
          variant/thread_support=false
          vram_texture_compression/for_desktop=true
          vram_texture_compression/for_mobile=false
          html/canvas_resize_policy=2
          html/focus_canvas_on_start=true
          progressive_web_app/enabled=false
          EOF
          mkdir -p "$RUNNER_TEMP/qa001-export"
          timeout 90s "$GODOT" --headless --editor --path game --import --quit 2>&1 | tee "$RUNNER_TEMP/qa001-import.log"
          timeout 180s "$GODOT" --headless --path game --export-release Web \
            "$RUNNER_TEMP/qa001-export/index.html" 2>&1 | tee "$RUNNER_TEMP/qa001-export.log"
          test -s "$RUNNER_TEMP/qa001-export/index.html"
          test -s "$RUNNER_TEMP/qa001-export/index.wasm"
          test -s "$RUNNER_TEMP/qa001-export/index.pck"
          cp "$RUNNER_TEMP/qa-original-project.godot" game/project.godot
          rm game/export_presets.cfg
          git diff --exit-code -- game/project.godot
          echo MARICA_QA001_GODOT_EXPORT_PASS

      - name: Boot actual Godot WebAssembly in Chrome and capture two cases
        shell: bash
        env:
          QA_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qa001-browser"
          python3 tools/qa/qa_web_profile.py \
            --web-dir "$RUNNER_TEMP/qa001-export" \
            --output "$RUNNER_TEMP/qa001-browser" \
            --head-sha "$QA_HEAD" 2>&1 | tee "$RUNNER_TEMP/qa001-web-test.log"
          grep -Fq MARICA_QA001_WEB_BOOT_PASS "$RUNNER_TEMP/qa001-web-test.log"

      - name: Preserve immutable exported QA Web build, screenshots and hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa001-godot-web-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/qa001-export/*
            ${{ runner.temp }}/qa001-browser/*
            ${{ runner.temp }}/qa001-*.log
